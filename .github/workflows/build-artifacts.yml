name: Build submission artifacts

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_submission_artifacts.py"
      - ".github/workflows/build-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install artifact dependencies
        run: pip install python-pptx reportlab

      - name: Generate PDF and PPTX submission files
        run: python scripts/build_submission_artifacts.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Project_Description.pdf docs/Pitch_Deck.pdf docs/Pitch_Deck.pptx
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Build submission PDF and PPTX artifacts"
            git pull --rebase origin main
            git push origin main
          fi
